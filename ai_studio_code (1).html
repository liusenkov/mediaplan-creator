<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Момент: Медиаплан Калькулятор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .input-group:disabled { background-color: #f3f4f6; cursor: not-allowed; }
        select[multiple] { height: 120px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 font-sans">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex flex-col md:row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="calculator" class="text-blue-600"></i> МОМЕНТ: Media Plan Generator
                </h1>
                <p class="text-slate-500 text-sm">Интерактивный калькулятор для VK Рекламы</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportToGoogleSheets()" id="exportBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl flex items-center gap-2 transition-all shadow-lg shadow-green-100 font-semibold">
                    <i data-lucide="file-spreadsheet"></i> Сформировать Sheets
                </button>
            </div>
        </div>

        <div id="positions-container" class="space-y-6">
            <!-- Сюда добавляются позиции -->
        </div>

        <div class="mt-8 flex justify-center">
            <button onclick="addPosition()" class="flex items-center gap-2 text-blue-600 hover:text-blue-800 font-medium py-3 px-6 rounded-xl border-2 border-dashed border-blue-200 hover:border-blue-400 transition-all bg-white">
                <i data-lucide="plus-circle"></i> Добавить позицию МП
            </button>
        </div>

        <!-- Превью -->
        <div class="mt-12 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="table"></i> ПРЕВЬЮ МЕДИАПЛАНА (TOTAL)
                </h2>
                <span id="total-budget-badge" class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm font-bold">0 ₽</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white text-[10px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Позиция</th>
                            <th class="p-4">Таргетинг</th>
                            <th class="p-4">Формат</th>
                            <th class="p-4">Бюджет (с НДС)</th>
                            <th class="p-4">Показы</th>
                            <th class="p-4">Охват</th>
                            <th class="p-4">Результат</th>
                        </tr>
                    </thead>
                    <tbody id="preview-body" class="text-sm divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Template -->
    <template id="pos-template">
        <div class="position-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative animate-in fade-in duration-300">
            <div class="absolute -left-3 top-6 bg-slate-800 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold shadow-lg pos-index">1</div>
            <button onclick="removePosition(this)" class="absolute top-4 right-4 text-slate-300 hover:text-red-500"><i data-lucide="trash-2"></i></button>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-2">
                <!-- Блок 1 -->
                <div class="space-y-4">
                    <h4 class="text-xs font-bold uppercase text-blue-600 flex items-center gap-1">
                        <i data-lucide="users" size="14"></i> Аудитория
                    </h4>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase font-bold">География</label>
                        <select multiple class="geo-input w-full mt-1 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="РФ" selected>РФ</option>
                            <option value="РФ, города-миллионники">РФ, города-миллионники</option>
                            <option value="РФ, города с населением 100 000+ чел.">РФ, 100 000+ чел.</option>
                            <option value="Москва">Москва</option>
                            <option value="СПб">СПб</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/3">
                            <label class="text-[10px] text-slate-400 uppercase font-bold">Пол</label>
                            <select class="gender-input w-full mt-1 border rounded-lg p-2 text-xs">
                                <option>М/Ж</option><option>М</option><option>Ж</option>
                            </select>
                        </div>
                        <div class="w-2/3">
                            <label class="text-[10px] text-slate-400 uppercase font-bold">Возраст</label>
                            <div class="flex items-center gap-1 mt-1">
                                <input type="number" value="25" class="age-from w-full border rounded-lg p-2 text-xs">
                                <span class="text-slate-300">-</span>
                                <input type="number" value="55" class="age-to w-full border rounded-lg p-2 text-xs">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase font-bold">Интересы VK Ads</label>
                        <select multiple class="interest-input w-full mt-1 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="обустройство и ремонт" selected>Обустройство и ремонт</option>
                            <option value="строительство">Строительство</option>
                            <option value="инструменты">Инструменты</option>
                            <option value="дизайн интерьера">Дизайн интерьера</option>
                            <option value="дачники">Дачники</option>
                        </select>
                    </div>
                </div>

                <!-- Блок 2 -->
                <div class="space-y-4 border-x border-slate-50 px-4">
                    <h4 class="text-xs font-bold uppercase text-blue-600 flex items-center gap-1">
                        <i data-lucide="target" size="14"></i> Стратегия и KPI
                    </h4>
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="text-[10px] text-slate-400 uppercase font-bold">Период</label>
                            <input type="number" value="10" class="period-val w-full mt-1 border rounded-lg p-2 text-xs" oninput="updateGrammar(this)">
                        </div>
                        <div class="w-1/2">
                            <label class="text-[10px] text-slate-400 uppercase font-bold">&nbsp;</label>
                            <select class="period-unit w-full mt-1 border rounded-lg p-2 text-xs" onchange="updateGrammar(this)">
                                <option value="месяц">месяцев</option>
                                <option value="неделя">недель</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase font-bold">Цель</label>
                        <select class="goal-input w-full mt-1 border rounded-lg p-2 text-xs font-bold text-blue-700 bg-blue-50 border-blue-100" onchange="toggleFields(this)">
                            <option value="reach">Охват (reach)</option>
                            <option value="followers">Подписчики (followers)</option>
                            <option value="engagement">Вовлечение (engagement)</option>
                        </select>
                    </div>
                    <div class="space-y-2 pt-2 border-t">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase">CPM (₽)</span>
                            <input type="number" value="100" class="kpi-cpm w-20 border rounded p-1 text-xs text-right">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase">Бюджет (₽)</span>
                            <input type="number" value="2273057" class="kpi-budget w-24 border rounded p-1 text-xs text-right">
                        </div>
                    </div>
                </div>

                <!-- Блок 3 -->
                <div class="space-y-4">
                    <h4 class="text-xs font-bold uppercase text-blue-600 flex items-center gap-1">
                        <i data-lucide="trending-up" size="14"></i> Прогноз
                    </h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] text-slate-400 uppercase font-bold">Частота</label>
                            <input type="number" value="3" class="f-freq w-full mt-1 border rounded p-2 text-xs">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 uppercase font-bold">CTR (%)</label>
                            <input type="number" value="0.10" step="0.01" class="f-ctr w-full mt-1 border rounded p-2 text-xs">
                        </div>
                    </div>
                    <div class="extra-fields hidden animate-in slide-in-from-top-2">
                        <label class="text-[10px] text-slate-400 uppercase font-bold">CR результата (%)</label>
                        <input type="number" value="12" class="f-cr w-full mt-1 border rounded p-2 text-xs">
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        // Вставьте сюда URL из Google Apps Script
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr6zGOyR7CBzK7oZH_KoZkYRCYRnobmc_Vq6iZCc3ya0Y_cCAMKTJHMCTZBE8Hh6ieig/exec"; 

        window.onload = () => {
            addPosition();
            setInterval(calculate, 1000);
        };

        function addPosition() {
            const container = document.getElementById('positions-container');
            const template = document.getElementById('pos-template').content.cloneNode(true);
            container.appendChild(template);
            reindex();
            lucide.createIcons();
        }

        function removePosition(btn) {
            if (document.querySelectorAll('.position-card').length > 1) {
                btn.closest('.position-card').remove();
                reindex();
            }
        }

        function reindex() {
            document.querySelectorAll('.pos-index').forEach((el, i) => el.innerText = i + 1);
        }

        function toggleFields(select) {
            const card = select.closest('.position-card');
            card.querySelector('.extra-fields').classList.toggle('hidden', select.value === 'reach');
        }

        function updateGrammar(el) {
            const card = el.closest('.position-card');
            const val = parseInt(card.querySelector('.period-val').value) || 0;
            const unit = card.querySelector('.period-unit');
            const forms = unit.value.includes('мес') ? ['месяц', 'месяца', 'месяцев'] : ['неделя', 'недели', 'недель'];
            unit.options[unit.selectedIndex].text = getDecl(val, forms);
        }

        function getDecl(n, f) {
            n = Math.abs(n) % 100; let n1 = n % 10;
            if (n > 10 && n < 20) return f[2];
            if (n1 > 1 && n1 < 5) return f[1];
            if (n1 == 1) return f[0];
            return f[2];
        }

        function calculate() {
            const cards = document.querySelectorAll('.position-card');
            let totalB = 0;
            let html = '';

            cards.forEach((card, i) => {
                const budget = parseFloat(card.querySelector('.kpi-budget').value) || 0;
                const cpm = parseFloat(card.querySelector('.kpi-cpm').value) || 1;
                const freq = parseFloat(card.querySelector('.f-freq').value) || 1;
                const ctr = parseFloat(card.querySelector('.f-ctr').value) || 0;
                const goal = card.querySelector('.goal-input').value;

                const imps = (budget / cpm) * 1000;
                const reach = imps / freq;
                const clicks = imps * (ctr / 100);
                
                let res = '-';
                if (goal !== 'reach') {
                    const cr = parseFloat(card.querySelector('.f-cr').value) || 0;
                    res = Math.round(clicks * (cr/100)).toLocaleString();
                }

                totalB += budget * 1.2;

                const geo = Array.from(card.querySelector('.geo-input').selectedOptions).map(o => o.text).join(', ');

                html += `<tr>
                    <td class="p-4 border-b font-bold text-slate-400">#${i+1}</td>
                    <td class="p-4 border-b text-[10px]">${geo}</td>
                    <td class="p-4 border-b font-bold italic">Универсальное (${goal})</td>
                    <td class="p-4 border-b font-bold">${(budget * 1.2).toLocaleString()} ₽</td>
                    <td class="p-4 border-b">${Math.round(imps).toLocaleString()}</td>
                    <td class="p-4 border-b">${Math.round(reach).toLocaleString()}</td>
                    <td class="p-4 border-b text-blue-600 font-bold">${res}</td>
                </tr>`;
            });

            document.getElementById('preview-body').innerHTML = html;
            document.getElementById('total-budget-badge').innerText = Math.round(totalB).toLocaleString() + ' ₽';
        }

        async function exportToGoogleSheets() {
            const btn = document.getElementById('exportBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Отправка...';

            const cards = document.querySelectorAll('.position-card');
            const data = { positions: [] };

            cards.forEach(card => {
                data.positions.push({
                    targeting: `РФ, ${Array.from(card.querySelector('.geo-input').selectedOptions).map(o => o.text).join(', ')}; ${card.querySelector('.gender-input').value}, ${card.querySelector('.age-from').value}-${card.querySelector('.age-to').value}`,
                    format: card.querySelector('.goal-input').value,
                    period: card.querySelector('.period-val').value + ' ' + card.querySelector('.period-unit').options[card.querySelector('.period-unit').selectedIndex].text,
                    budget: card.querySelector('.kpi-budget').value,
                    cpm: card.querySelector('.kpi-cpm').value,
                    imps: Math.round((card.querySelector('.kpi-budget').value / card.querySelector('.kpi-cpm').value) * 1000)
                });
            });

            try {
                // Отправляем данные в Google Apps Script
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                alert('Готово! Проверьте Google Диск (файл создается в облаке).');
            } catch (e) {
                alert('Ошибка отправки');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
